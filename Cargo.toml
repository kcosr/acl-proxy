[package]
name = "acl-proxy"
version.workspace = true
edition = "2021"
license = "MIT"
publish = false
authors = ["tsagent <tsagent@example.com>"]
description = "Rust rewrite of acl-proxy with HTTP/2, streaming, and TOML configuration."

[workspace]
members = [".", "crates/access-flow-relay"]
default-members = [".", "crates/access-flow-relay"]
resolver = "2"

[workspace.package]
version = "0.3.0-rc.1"

[[bin]]
name = "acl-proxy-extract-capture-body"
path = "src/bin/extract-capture-body.rs"

[dependencies]
clap = { version = "4.5.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10", features = ["oid"] }
toml = "0.8"
thiserror = "1.0"
once_cell = "1.19"
arc-swap = "1.7"
ipnet = { version = "2.9", features = ["serde"] }
if-addrs = { version = "0.15.0", features = ["link-local"] }
regex = "1.11"
zeroize = "1.9"
allocator-api2 = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
base64 = "0.22"
bytes = "1"
brotli = "8.0"
compu-brotli-sys = "=1.2.0"
crc32fast = "1.4"
flate2 = "1.0"
miniz_oxide = { version = "0.8", default-features = false, features = ["std"] }
zstd = "0.13"
zstd-sys = { version = "2.0.16", default-features = false, features = ["experimental"] }
rand = "0.8"
tokio = { version = "1.39", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "signal", "process"] }
httparse = "1.10.1"
chrono = { version = "0.4", features = ["serde", "clock"] }
http = "=1.4.2"
rustls = { version = "=0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "=1.15.0"
rustls-webpki = { version = "=0.103.13", default-features = false, features = ["alloc", "ring", "std"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
x509-cert = { version = "=0.2.5", default-features = false, features = ["pem"] }
fs2 = "0.4"
humantime = "2.1"
access-async-contracts = { path = "../access-runtime/crates/access-async-contracts", version = "=0.1.0" }
access-flow = { path = "../access-runtime/crates/access-flow", version = "=0.1.0" }
access-flow-tls = { path = "../access-runtime/crates/access-flow-tls", version = "=0.1.0" }
access-flow-unix = { path = "../access-runtime/crates/access-flow-unix", version = "=0.1.0" }
access-identity = { path = "../access-runtime/crates/access-identity", version = "=0.1.0" }
access-rpc-framing = { path = "../access-runtime/crates/access-rpc-framing", version = "=0.1.0" }
access-tls-trust = { path = "../access-runtime/crates/access-tls-trust", version = "=0.1.0" }
http-access-types = { path = "../access-runtime/crates/http-access-types", version = "=0.1.0" }
http-access-url = { path = "../access-runtime/crates/http-access-url", version = "=0.1.0" }
http-access-runtime = { path = "../access-runtime/crates/http-access-runtime", version = "=0.1.0" }
http-access-mitm = { path = "../access-runtime/crates/http-access-mitm", version = "=0.1.0" }
http-access-policy-acl = { path = "../access-runtime/crates/http-access-policy-acl", version = "=0.1.0" }
http-access-redaction = { path = "../access-runtime/crates/http-access-redaction", version = "=0.1.0" }
credential-core = { path = "../access-runtime/crates/credential-core", version = "=0.1.0" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "=1.1.4", default-features = false, features = ["std", "fs", "process"] }
socket2 = { version = "0.6", features = ["all"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[dev-dependencies]
access-tls-trust = { path = "../access-runtime/crates/access-tls-trust", version = "=0.1.0", features = ["conformance-fixtures"] }
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
h2 = "=0.4.15"
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa", "pem", "pkcs8", "std"] }
x509-cert = { version = "=0.2.5", default-features = false, features = ["builder", "pem"] }
http-access-runtime = { path = "../access-runtime/crates/http-access-runtime", version = "=0.1.0", features = ["dev-harness"] }
http-access-conformance = { path = "../access-runtime/crates/http-access-conformance", version = "=0.1.0" }

[profile.release]
opt-level = 3

[patch.crates-io]
hyper = { path = "../access-runtime/third_party/hyper" }
