[package]
name = "acl-proxy"
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["tsagent <tsagent@example.com>"]
description = "Rust rewrite of acl-proxy with HTTP/2, streaming, and TOML configuration."

[[bin]]
name = "acl-proxy-extract-capture-body"
path = "src/bin/extract-capture-body.rs"

[dependencies]
clap = { version = "4.5.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"
thiserror = "1.0"
once_cell = "1.19"
arc-swap = "1.7"
ipnet = { version = "2.9", features = ["serde"] }
if-addrs = { version = "0.15.0", features = ["link-local"] }
idna = "1.1"
regex = "1.11"
regex-automata = { version = "0.4.13", default-features = false, features = ["std", "syntax", "dfa-build", "dfa-search", "unicode"] }
memchr = "2.7"
zeroize = "1.9"
allocator-api2 = "0.2"
url = "2.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
base64 = "0.22"
bytes = "1"
brotli = "8.0"
compu-brotli-sys = "=1.2.0"
crc32fast = "1.4"
flate2 = "1.0"
miniz_oxide = { version = "0.8", default-features = false, features = ["std"] }
zstd = "0.13"
zstd-sys = { version = "2.0.16", default-features = false, features = ["experimental"] }
rand = "0.8"
tokio = { version = "1.39", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "signal", "process"] }
hyper = { version = "0.14", features = ["full"] }
httparse = "1.10.1"
tokio-stream = "0.1"
chrono = { version = "0.4", features = ["serde", "clock"] }
time = "0.3"
http = "0.2"
rustls = { version = "0.21", features = ["dangerous_configuration"] }
rustls-native-certs = "0.6"
webpki = { package = "rustls-webpki", version = "0.101" }
tokio-rustls = "0.24"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
rustls-pemfile = "1"
lru = "0.12"
fs2 = "0.4"
humantime = "2.1"
http-access-types = { path = "../access-runtime/crates/http-access-types", version = "=0.1.0" }
http-access-url = { path = "../access-runtime/crates/http-access-url", version = "=0.1.0" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
socket2 = { version = "0.6", features = ["all"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
h2 = "0.3"
http-access-conformance = { path = "../access-runtime/crates/http-access-conformance", version = "=0.1.0" }

[profile.release]
opt-level = 3
