schema_version = 3

[service]
request_timeout = "2h"
shutdown_drain_timeout = "30s"
max_inflight_wire_body_bytes = 17179869184
max_inflight_wire_body_bytes_per_quota_key = 2147483648
min_wire_body_concurrency = 64

[control]
bind = "127.0.0.1:8898"
base_path = "/_acl-proxy"
request_body_timeout = "10s"

[listeners.transparent_http]
endpoint.kind = "access_flow"
endpoint.admission_timeout = "2s"
endpoint.allowed_destination_ports = [80]
http_versions = ["http1"]
max_connections = 1024

[listeners.transparent_http.endpoint.transport]
kind = "unix"
path = "/Users/fixture-user/Library/Application Support/AW Gateway/runtime/transparent-http.sock"
mode = "0600"

[listeners.transparent_https]
endpoint.kind = "access_flow"
endpoint.admission_timeout = "2s"
endpoint.allowed_destination_ports = [443]
http_versions = ["http1", "http2"]
max_connections = 1024

[listeners.transparent_https.endpoint.transport]
kind = "unix"
path = "/Users/fixture-user/Library/Application Support/AW Gateway/runtime/transparent-https.sock"
mode = "0600"

[mitm]
mode = "generated"
directory = "runtime/certs"

[egress]
route = "parent_proxy"

[egress.origin_tls]
trust = "system"
http_versions = ["http1", "http2"]

[egress.parent_proxy]
kind = "generic"
url = "https://external-proxy.example.test:8443"

[egress.parent_proxy.tls]
trust = "system"

[[egress.credential_actions]]
kind = "custom_header"
transport_security = "cleartext_allowed"
header = "x-aw-identity-token"
credential = "workstation_identity"

[policy]
default = "deny"

[[policy.rules]]
id = "prod-host-uds-workstation"
description = "All Unix ingress shares the fixed local-workstation principal"
decision = "allow"
urls = ["**"]

[credentials]
allowed_custom_headers = ["x-aw-identity-token"]

[credentials.sources.workstation_identity]
source = "environment"
variable = "AW_IDENTITY_TOKEN"

[observation.logging]
level = "info"
directory = "runtime/logs"
max_bytes = 104857600
max_files = 5
console = false

[observation.logging.policy_decisions]
allows = false
denies = true
allow_level = "info"
deny_level = "warn"

[safety.loop_detection]
inject = true
header = "x-acl-proxy-request-id"
