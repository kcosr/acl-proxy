[authorization]
internal_context_headers = ["x-aw-policy-context"]

[authorization.providers.gitlab_acl]
kind = "process"
command = "providers/gitlab_acl.py"
args = ["--config", "providers/gitlab_acl.json"]
timeout = "1s"
on_failure = "deny"
inherit_environment = false
environment = { PATH = "/usr/bin:/bin" }
include_headers = ["x-aw-policy-context"]
include_identity = true
include_request_body = false
allow_request_body_replacement = false
max_pending_requests = 256
restart_backoff = "1s"
retire_timeout = "2h"

[authorization.providers.agent_runner_acl]
kind = "process"
command = "providers/agent_runner_acl.py"
args = ["--config", "providers/agent_runner_acl.json"]
timeout = "1s"
on_failure = "deny"
inherit_environment = false
environment = { PATH = "/usr/bin:/bin" }
include_headers = []
include_identity = true
include_request_body = false
allow_request_body_replacement = false
max_pending_requests = 256
restart_backoff = "1s"
retire_timeout = "2h"

[redaction.profiles.sensitive_strings]
replacement = "[REDACTED]"
max_body_bytes = 10485760
max_decoded_body_bytes = 52428800
max_frame_bytes = 262144
max_message_bytes = 1048576
allow_permessage_deflate = false
unsupported_extensions = "strip"
max_environment_literal_sources = 64
max_environment_literal_bytes = 65536
max_environment_literal_total_bytes = 1048576

[[redaction.profiles.sensitive_strings.rules]]
literals = ["synthetic-safe-literal"]
literal_environment_variables = [
  "FIXTURE_REDACT_A",
  "FIXTURE_REDACT_B",
  "FIXTURE_REDACT_C",
  "FIXTURE_REDACT_D",
  "FIXTURE_REDACT_E",
]
expressions = ["fixture-secret-[A-Za-z0-9_.-]{20,}"]
payloads = "text"

[observation.logging]
level = "info"
directory = "runtime/logs"
max_bytes = 104857600
max_files = 5
console = false

[observation.logging.policy_decisions]
allows = false
denies = true
allow_level = "info"
deny_level = "warn"

[safety.loop_detection]
inject = true
header = "x-acl-proxy-request-id"
