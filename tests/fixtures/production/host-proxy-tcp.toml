schema_version = 3

[service]
request_timeout = "2h"
shutdown_drain_timeout = "30s"
max_active_webhook_deliveries = 256
webhook_transport_buffer_bytes = 65536
max_webhook_transport_bytes = 67108864
max_inflight_wire_body_bytes = 17179869184
max_inflight_wire_body_bytes_per_quota_key = 2147483648
min_wire_body_concurrency = 64
max_content_decoding_expansion_ratio = 128

[control]
bind = "127.0.0.1:8898"
base_path = "/_acl-proxy"
request_body_timeout = "10s"

[listeners.explicit_http]
endpoint.kind = "tcp"
endpoint.address = "127.0.0.1:8881"
http_versions = ["http1"]

[listeners.explicit_http.identity]
mode = "required"

[listeners.explicit_http.connect]
http1 = "mitm"

[listeners.transparent_https]
endpoint.kind = "tcp"
endpoint.address = "0.0.0.0:8889"
http_versions = ["http1", "http2"]

[mitm]
mode = "generated"
directory = "runtime/certs"

[identity]
max_pending_authentications = 256
max_pending_authentications_per_connection = 16

[identity.resolver]
kind = "static"
authority = "aw-workstation"

[[identity.resolver.principals]]
id = "fixture-container"
kind = "service_account"

[[identity.resolver.groups]]
id = "fixture-developers"
members = ["fixture-container"]

[[identity.resolver.groups]]
id = "fixture-agent-runners"
members = ["fixture-container"]

[[identity.resolver.tokens]]
id = "fixture-container-primary"
principal = "fixture-container"
source = "environment"
variable = "AW_IDENTITY_TOKEN"

[egress]
route = "direct"

[egress.origin_tls]
trust = "system"
http_versions = ["http1"]

[[egress.request_headers]]
operation = "remove"
when = "always"
name = "x-aw-policy-context"

[policy]
default = "deny"

[[policy.rules]]
id = "prod-host-parent-connect"
description = "Parent CONNECT bootstrap for the sanitized container network"
decision = "allow"
urls = ["**"]
methods = ["CONNECT"]
client_cidrs = ["198.18.0.0/15"]

