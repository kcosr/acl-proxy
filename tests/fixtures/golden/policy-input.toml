schema_version = "2"

[proxy]
listeners.explicit_http.bind = "127.0.0.1:1"

[logging]
directory = "logs"
level = "info"

[capture]
allowed_request = false
allowed_response = false
denied_request = false
denied_response = false
directory = "logs-capture"

[policy]
default = "deny"

[[policy.rules]]
action = "deny"
pattern = "https://example.com/admin/**"
description = "deny administration"
rule_id = "deny-admin"

[[policy.rules]]
action = "delegate"
pattern = "https://example.com/app/**"
description = "delegate application"
rule_id = "delegate-app"
external_auth_profile = "approval"

[[policy.rules]]
action = "allow"
pattern = "https://example.com/app/**"
description = "allow after delegate pass"
rule_id = "allow-app-after-pass"

[[policy.rules]]
action = "allow"
pattern = "https://example.com/public/**"
description = "allow public"
rule_id = "allow-public"

[policy.external_auth_profiles.approval]
type = "http"
webhook_url = "http://127.0.0.1:9999/approval"
timeout_ms = 30000
