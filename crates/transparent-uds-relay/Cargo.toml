[package]
name = "acl-proxy-transparent-uds-relay"
version.workspace = true
edition = "2021"
license = "MIT"
publish = false
description = "Linux transparent TCP to Unix socket relay for ACL Proxy"

[features]
test-seam = []

[target.'cfg(target_os = "linux")'.dependencies]
humantime = "2.1"
libc = "0.2"
proxy-protocol-v2-codec = { path = "../../../access-runtime/crates/proxy-protocol-v2-codec", version = "=0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.39", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile = "3.10"
