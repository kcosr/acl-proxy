# Strict schema-v4 sample. Unknown or obsolete fields are rejected.
# This active configuration is loopback-only and deny-by-default.

schema_version = 4

[service]
request_timeout = "30s"
shutdown_drain_timeout = "30s"
max_retiring_generations = 2
max_active_upgrades = 256
max_active_webhook_deliveries = 256
webhook_transport_buffer_bytes = 65536
max_webhook_transport_bytes = 67108864
upgrade_relay_buffer_bytes = 65536
max_upgrade_buffer_bytes = 2147483648
max_upgrade_lifetime = "8h"
max_inflight_wire_body_bytes = 17179869184
max_inflight_wire_body_bytes_per_quota_key = 2147483648
min_wire_body_concurrency = 64
max_content_decoding_expansion_ratio = 128

# Readiness and authorization callbacks belong only on this control listener.
[control]
bind = "127.0.0.1:8898"
base_path = "/_acl-proxy"
request_header_timeout = "10s"
request_body_timeout = "10s"
max_connections = 128
max_request_body_bytes = 65536

[listeners.explicit_http]
endpoint = { kind = "tcp", address = "127.0.0.1:8881" }
http_versions = ["http1"]
request_header_timeout = "10s"
max_connections = 1024
max_concurrent_streams = 128

[listeners.explicit_http.connect]
http1 = "deny"

[egress]
route = "direct"

[egress.origin_tls]
trust = "system"
http_versions = ["http1", "http2"]

# Project an admitted Access Flow v2 execution context only to selected HTTPS
# URLs. The fixed outbound header is X-Agent-Access-Context.
#
# [egress.access_flow_execution_context]
# urls = ["https://agent-access-broker-dev.vailsys.net/**"]

[policy]
default = "deny"

# This file also authorizes its implicit sibling rules.d directory. Each direct
# fragment is a strict schema-4 document containing only one or more
# [[rules]] entries. Fragments run first in ASCII filename order. They have
# equal policy authority to this main rule list. Keep both main and rules.d under
# one trusted serialized writer; stage outside rules.d, atomically rename
# complete fragments into place, then trigger one reload.
# Use fixed-width names such as 00-base.toml and 10-team.toml; raw ASCII order
# is normative. Deploy or roll back the binary, main file, and complete rules.d
# directory together as one coordinated transaction.
#
# Add narrowly scoped rules after reviewing canonical URL, method, client, and
# header intent. An empty urls list means every canonical HTTP/HTTPS URL.
#
# [[policy.rules]]
# id = "example-read-only"
# description = "Example API reads"
# decision = "allow"
# urls = ["https://api.example.test/v1/**"]
# methods = ["GET", "HEAD"]
# client_cidrs = ["192.0.2.0/24"]
# execution_contexts = ["internal", "external"]
# allow_upgrades = false
#
# [policy.rules.headers]
# present_all = ["x-workload-id"]
# none = { x-blocked = ["true"] }

[observation.logging]
level = "info"
max_bytes = 104857600
max_files = 5
console = true

[observation.logging.policy_decisions]
allows = false
denies = true
allow_level = "info"
deny_level = "warn"

[safety.loop_detection]
inject = true
header = "x-acl-proxy-request-id"

# CONNECT MITM or transparent HTTPS requires a MITM authority. Prefer generated
# mode for local evaluation; export its public chain with `acl-proxy export-ca`.
#
# [mitm]
# mode = "generated"
# directory = "runtime/certs"
# max_cached_certificates = 1024
# persist_leaf_certificates = false

# Parent-proxy egress is an end-state alternative to direct egress.
# Parent endpoints must not resolve to loopback or a local interface.
#
# [egress]
# route = "parent_proxy"
#
# [egress.parent_proxy]
# kind = "acl_proxy"
# url = "https://parent-proxy.example.test:8443"
#
# [egress.parent_proxy.tls]
# trust = "system"

# Typed environment credentials replace attacker-supplied destination values.
# Generic ${NAME} interpolation is not supported.
#
# [credentials]
# allowed_custom_headers = ["x-workload-token"]
#
# [credentials.sources.workload]
# source = "environment"
# variable = "WORKLOAD_TOKEN"
#
# [[egress.credential_actions]]
# kind = "custom_header"
# transport_security = "tls_required"
# header = "x-workload-token"
# credential = "workload"

# Environment-backed redaction literals are explicit required sources resolved
# at generation activation/reload. Values never enter config or policy dumps.
#
# [redaction.profiles.sensitive]
# replacement = "[REDACTED]"
# max_body_bytes = 10485760
# max_decoded_body_bytes = 52428800
# max_frame_bytes = 262144
# max_message_bytes = 1048576
# allow_permessage_deflate = false
# unsupported_extensions = "deny" # deny | strip
#
# [[redaction.profiles.sensitive.rules]]
# literals = ["safe-fixture-literal"]
# literal_environment_variables = ["REDACT_SECRET_A", "REDACT_SECRET_B"]
# expressions = ["token-[A-Za-z0-9_.-]{20,}"]
# payloads = "text"
